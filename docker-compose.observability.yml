# Observability (§63): Prometheus, Alertmanager and Grafana, as a third compose file.
#
# A separate file rather than a profile in docker-compose.prod.yml, for one
# reason found the hard way: compose interpolates the whole file it is given,
# profiles or not, so a required `${GRAFANA_ADMIN_PASSWORD:?}` in the main file
# stopped every `up`, `ps` and `logs` on a host that had not set it. Here the
# requirement applies only when this file is asked for:
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.cpanel.yml \
#     -f docker-compose.observability.yml --env-file .env.production up -d
#
# Prometheus scrapes the two API processes over the compose network and Grafana
# provisions itself from docker/observability: the datasource, the dashboard and
# the alert rules are files in this repository, so a fresh host gets the same
# screens and a change to a threshold is a reviewed commit.
#
# Grafana is published on the loopback interface only. It is an operator's tool
# that sees the shape of the whole platform; reach it over an SSH tunnel
# (`ssh -L 3001:127.0.0.1:3001 tp-server`) rather than through the edge.
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api: { condition: service_healthy }
      alertmanager: { condition: service_started }

  # Where a firing alert goes. Until 25 September there was nothing here:
  # Prometheus evaluated the rules in alerts.yml and nobody was told. Email,
  # because that is what the owner chose; the addresses are the deployment's
  # (.env.production), and the SMTP password is a file, never a variable —
  # see docs/observability.md, "Where an alert goes".
  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/etc/alertmanager/entrypoint.sh']
    environment:
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:?set ALERT_SMTP_HOST (host:port)}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:?set ALERT_SMTP_USER}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:?set ALERT_EMAIL_FROM}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:?set ALERT_EMAIL_TO}
    volumes:
      - ./docker/observability/alertmanager/alertmanager.yml.template:/etc/alertmanager/alertmanager.yml.template:ro
      - ./docker/observability/alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - ${ALERT_SMTP_PASSWORD_FILE:?set ALERT_SMTP_PASSWORD_FILE to a file holding the SMTP password}:/run/secrets/alert_smtp_password:ro
      - alertmanager-data:/alertmanager

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3001}:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_SERVER_ROOT_URL: http://127.0.0.1:${GRAFANA_PORT:-3001}
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
