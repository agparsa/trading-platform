packages:
  - 'apps/*'
  - 'packages/*'

catalog:
  # --- language / tooling ---
  typescript: 5.9.3
  tsx: ^4.20.3
  vitest: ^3.2.7
  '@vitest/coverage-v8': ^3.2.7
  eslint: ^9.39.5
  typescript-eslint: ^8.67.0
  '@eslint/js': ^9.39.5
  prettier: ^3.9.6
  rimraf: ^6.0.1

  # --- domain / shared ---
  'decimal.js': ^10.6.0
  zod: ^4.4.3

  # --- backend ---
  '@nestjs/common': ^11.2.1
  '@nestjs/core': ^11.2.1
  '@nestjs/config': ^4.0.2
  '@nestjs/jwt': ^11.0.2
  '@nestjs/throttler': ^6.5.0
  '@node-rs/argon2': ^2.1.0
  '@nestjs/platform-express': ^11.2.1
  '@nestjs/platform-socket.io': ^11.2.1
  '@nestjs/websockets': ^11.2.1
  '@nestjs/swagger': ^11.4.7
  '@nestjs/terminus': ^11.0.0
  '@nestjs/testing': ^11.2.1
  '@nestjs/cli': ^11.0.24
  '@nestjs/schematics': ^11.0.0
  'reflect-metadata': ^0.2.2
  rxjs: ^7.8.2
  'socket.io': ^4.8.1
  '@prisma/client': ^6.19.3
  prisma: ^6.19.3
  ioredis: ^5.9.0
  bullmq: ^5.63.0
  'nestjs-zod': ^5.5.0
  'nestjs-pino': ^4.4.0
  pino: ^9.13.1
  'pino-http': ^10.5.0
  'pino-pretty': ^13.1.2
  helmet: ^8.1.0
  'prom-client': ^15.1.3

  # --- frontend ---
  next: ^15.5.23
  react: ^19.2.8
  'react-dom': ^19.2.8
  '@types/react': ^19.2.7
  '@types/react-dom': ^19.2.4
  '@tanstack/react-query': ^5.101.4
  zustand: ^5.0.15
  'socket.io-client': ^4.8.1
  # Apache-2.0, on npm. The interim renderer behind the datafeed boundary while
  # TradingView Advanced Charts (licensed, not on npm) is unavailable.
  'lightweight-charts': ^5.2.1
  tailwindcss: ^4.3.3
  '@tailwindcss/postcss': ^4.3.3
  postcss: ^8.5.6
  clsx: ^2.1.1
  'tailwind-merge': ^3.4.1

  # --- types ---
  '@types/node': ^22.19.0
  '@types/express': ^5.0.1

# Build scripts are opt-in under pnpm 10. Only these are trusted to run.
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - esbuild
  - '@tailwindcss/oxide'
  - sharp
  - unrs-resolver
