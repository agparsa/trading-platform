name: trading-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: tp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
      POSTGRES_DB: ${POSTGRES_DB:-trading_platform}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-trading} -d ${POSTGRES_DB:-trading_platform}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tp-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: development
    container_name: tp-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trading}:${POSTGRES_PASSWORD:-change_me_locally}@postgres:5432/${POSTGRES_DB:-trading_platform}?schema=public
      REDIS_URL: redis://redis:6379
      API_HOST: 0.0.0.0
    ports:
      - '${API_PORT:-4000}:4000'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages
      - ./prisma:/app/prisma

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      target: development
    container_name: tp-worker
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trading}:${POSTGRES_PASSWORD:-change_me_locally}@postgres:5432/${POSTGRES_DB:-trading_platform}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./apps/worker/src:/app/apps/worker/src
      - ./packages:/app/packages
      - ./prisma:/app/prisma

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: development
    container_name: tp-web
    restart: unless-stopped
    env_file: [.env]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-4000}/api/v1
      NEXT_PUBLIC_WS_URL: http://localhost:${API_PORT:-4000}
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      - api
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./packages:/app/packages

volumes:
  postgres-data:
  redis-data:
