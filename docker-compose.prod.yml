# The production stack.
#
# Different from `docker-compose.yml` in four ways that matter, and each of them
# is a decision rather than a tidy-up:
#
#  1. **Ingestion is its own process.** Exactly one may pull from the market data
#     provider — two would double-count candle volume — and a process that both
#     ingests and serves starves its own feed. That is not a theory: see
#     docs/capacity.md for the measurement. `api-ingest` serves nobody;
#     `api` serves everybody and relays prices over `market:ticks`.
#
#  2. **Nothing is exposed but Nginx.** Postgres, Redis, the API and the web app
#     have no host ports. The only way in is through one door, which is the only
#     way to be sure about what is behind it.
#
#  3. **No source volumes.** The image is what runs. A bind mount over
#     `apps/api/src` in production is a way to run code nobody built or tested.
#
#  4. **Migrations are a job, not a side effect of boot.** Two API replicas
#     racing `migrate deploy` is a lock contention at best; `migrate` runs once,
#     to completion, and everything else waits for it.
#
# Bring it up with:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# See docs/deployment.md.

name: trading-platform-prod

x-database-url: &database-url
  DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}?schema=public

x-api-env: &api-env
  <<: *database-url
  REDIS_URL: redis://redis:6379
  NODE_ENV: production
  API_HOST: 0.0.0.0
  API_PORT: 4000

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      # Checksums catch silent corruption on read rather than letting it become
      # a balance nobody can explain. They cost a few percent and are not
      # optional for a ledger.
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # `appendonly` because Redis carries the quote cache and the job queues. A
    # restart that lost the queue would lose scheduled reconciliations and
    # unsent notifications; it must not also silently lose them on a crash.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  # Runs once, to completion, before anything that reads the schema starts.
  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: production
    restart: 'no'
    env_file: [.env.production]
    environment: *api-env
    command: ['npx', 'prisma', 'migrate', 'deploy']
    depends_on:
      postgres: { condition: service_healthy }

  # The one process that pulls prices and fires stops. Never more than one.
  api-ingest:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: production
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      <<: *api-env
      MARKET_INGEST_ENABLED: 'true'
      TRIGGER_ENGINE_ENABLED: 'true'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  # Serves traffic. Scale this one: `docker compose ... up -d --scale api=3`.
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: production
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      <<: *api-env
      # Prices arrive over market:ticks from api-ingest. Stops are fired there
      # too — a replica that fired them as well would race it for the same rows.
      MARKET_INGEST_ENABLED: 'false'
      TRIGGER_ENGINE_ENABLED: 'false'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      target: production
    restart: unless-stopped
    env_file: [.env.production]
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: production
      args:
        # Baked in at build time: Next.js inlines NEXT_PUBLIC_* into the client
        # bundle, so setting them at runtime would change nothing the browser
        # ever sees. A deployment to a different hostname is a rebuild.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL, e.g. https://trade.example.com/api/v1}
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:?set PUBLIC_WS_URL, e.g. https://trade.example.com}
    restart: unless-stopped
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Certificates live outside the image. Mount whatever your issuer produces
      # at /etc/nginx/certs/fullchain.pem and privkey.pem; without them Nginx
      # serves HTTP only and says so in its log.
      - ${TLS_CERT_DIR:-./docker/nginx/certs}:/etc/nginx/certs:ro
    depends_on:
      - api
      - web
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/nginx-health']
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  postgres-data:
  redis-data:
