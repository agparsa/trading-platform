# The production stack.
#
# Different from `docker-compose.yml` in four ways that matter, and each of them
# is a decision rather than a tidy-up:
#
#  1. **Ingestion is its own process.** Exactly one may pull from the market data
#     provider — two would double-count candle volume — and a process that both
#     ingests and serves starves its own feed. That is not a theory: see
#     docs/capacity.md for the measurement. `api-ingest` serves nobody;
#     `api` serves everybody and relays prices over `market:ticks`.
#
#  2. **Nothing is exposed but Nginx.** Postgres, Redis, the API and the web app
#     have no host ports. The only way in is through one door, which is the only
#     way to be sure about what is behind it.
#
#  3. **No source volumes.** The image is what runs. A bind mount over
#     `apps/api/src` in production is a way to run code nobody built or tested.
#
#  4. **Migrations are a job, not a side effect of boot.** Two API replicas
#     racing `migrate deploy` is a lock contention at best; `migrate` runs once,
#     to completion, and everything else waits for it.
#
# Bring it up with:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# See docs/deployment.md.

name: trading-platform-prod

x-database-url: &database-url
  DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}?schema=public

x-api-env: &api-env
  <<: *database-url
  REDIS_URL: redis://redis:6379
  NODE_ENV: production
  API_HOST: 0.0.0.0
  API_PORT: 4000

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      # Checksums catch silent corruption on read rather than letting it become
      # a balance nobody can explain. They cost a few percent and are not
      # optional for a ledger.
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # `appendonly` because Redis carries the quote cache and the job queues. A
    # restart that lost the queue would lose scheduled reconciliations and
    # unsent notifications; it must not also silently lose them on a crash.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  # Runs once, to completion, before anything that reads the schema starts.
  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: production
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-}
        BUILD_SHA: ${BUILD_SHA:-unknown}
    restart: 'no'
    env_file: [.env.production]
    environment: *api-env
    command: ['npx', 'prisma', 'migrate', 'deploy']
    depends_on:
      postgres: { condition: service_healthy }

  # The one process that pulls prices and fires stops. Never more than one.
  api-ingest:
    # A descriptor ceiling that matches what this service is for.
    #
    # Docker's default is 1024. Measured on production, nginx and api-ws both
    # had exactly that, while nginx asked for 4096 connections per worker and
    # capacity.md documents a thousand-socket run — see docker/nginx/nginx.conf.
    # A limit is not an allocation; this costs nothing until it is needed.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: production
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-}
        BUILD_SHA: ${BUILD_SHA:-unknown}
    restart: unless-stopped
    stop_grace_period: 40s
    env_file: [.env.production]
    environment:
      <<: *api-env
      # These three say "may contend", not "does it". Which instance actually
      # runs each loop is decided by a lease (see docs/observability.md); the
      # flags decide who is eligible, and eligibility is what makes a rolling
      # deploy hand over rather than gap. Set on this service alone so the
      # per-tick work stays off the containers serving traders.
      MARKET_INGEST_ENABLED: 'true'
      TRIGGER_ENGINE_ENABLED: 'true'
      PRICE_ALERTS_ENABLED: 'true'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  # Serves traffic. Scale this one: `docker compose ... up -d --scale api=3`.
  api:
    # A descriptor ceiling that matches what this service is for.
    #
    # Docker's default is 1024. Measured on production, nginx and api-ws both
    # had exactly that, while nginx asked for 4096 connections per worker and
    # capacity.md documents a thousand-socket run — see docker/nginx/nginx.conf.
    # A limit is not an allocation; this costs nothing until it is needed.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: production
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-}
        BUILD_SHA: ${BUILD_SHA:-unknown}
    restart: unless-stopped
    # Drain first, then close: the API refuses newcomers on SIGTERM and finishes
    # the requests already inside it (SHUTDOWN_DRAIN_TIMEOUT_MS, default 25 s).
    # Docker's default 10 s would SIGKILL a process mid-drain.
    stop_grace_period: 40s
    env_file: [.env.production]
    environment:
      <<: *api-env
      # Prices arrive over market:ticks from api-ingest, and the loops that
      # decide things run there. Not because a second one would be unsafe — the
      # lease settles that now — but because this service is the one answering
      # traders, and a per-tick sweep does not belong behind their requests.
      #
      # Price alerts are here too, and deliberately: their sweep is a query per
      # moved instrument per second, which is small but is still a second job
      # per second on a container whose whole purpose is latency.
      MARKET_INGEST_ENABLED: 'false'
      TRIGGER_ENGINE_ENABLED: 'false'
      PRICE_ALERTS_ENABLED: 'false'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  # Serves the WebSocket (§77). The same image and the same flags as `api`,
  # reached only through Nginx's `/ws` location, so the process that fans out
  # frames to every connected terminal is not the process answering orders:
  # at a thousand connected accounts the valuation and fan-out work is what
  # saturated a serving instance (docs/capacity.md), and it is also the part
  # that scales by adding copies — each values only the accounts connected to
  # it. Domain events reach it from the HTTP instances over Redis, exactly as
  # they reach a second `api` replica today. Scale independently:
  # `--scale api-ws=2`.
  api-ws:
    # A descriptor ceiling that matches what this service is for.
    #
    # Docker's default is 1024. Measured on production, nginx and api-ws both
    # had exactly that, while nginx asked for 4096 connections per worker and
    # capacity.md documents a thousand-socket run — see docker/nginx/nginx.conf.
    # A limit is not an allocation; this costs nothing until it is needed.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: production
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-}
        BUILD_SHA: ${BUILD_SHA:-unknown}
    restart: unless-stopped
    stop_grace_period: 40s
    env_file: [.env.production]
    environment:
      <<: *api-env
      MARKET_INGEST_ENABLED: 'false'
      TRIGGER_ENGINE_ENABLED: 'false'
      PRICE_ALERTS_ENABLED: 'false'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker:
    # A descriptor ceiling that matches what this service is for.
    #
    # Docker's default is 1024. Measured on production, nginx and api-ws both
    # had exactly that, while nginx asked for 4096 connections per worker and
    # capacity.md documents a thousand-socket run — see docker/nginx/nginx.conf.
    # A limit is not an allocation; this costs nothing until it is needed.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      target: production
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-}
        BUILD_SHA: ${BUILD_SHA:-unknown}
    restart: unless-stopped
    # A swap-accrual run can outlive Docker's default 10 s grace period.
    stop_grace_period: 40s
    env_file: [.env.production]
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: production
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-}
        BUILD_SHA: ${BUILD_SHA:-unknown}
        # Baked in at build time: Next.js inlines NEXT_PUBLIC_* into the client
        # bundle, so setting them at runtime would change nothing the browser
        # ever sees. A deployment to a different hostname is a rebuild.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL, e.g. https://trade.example.com/api/v1}
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:?set PUBLIC_WS_URL, e.g. https://trade.example.com}
    restart: unless-stopped
    environment:
      # Next's standalone server binds whatever `HOSTNAME` says, and Docker sets
      # that variable to the container id. So it bound to the container's own
      # address, its Dockerfile healthcheck fetched 127.0.0.1 and was refused,
      # and the container sat "unhealthy" forever while serving every request
      # perfectly. A healthcheck that can never pass is worse than none: it is a
      # signal people learn to ignore, and it was ignored here for a day.
      HOSTNAME: '0.0.0.0'
      PORT: '3000'
    depends_on:
      - api

  nginx:
    # A descriptor ceiling that matches what this service is for.
    #
    # Docker's default is 1024. Measured on production, nginx and api-ws both
    # had exactly that, while nginx asked for 4096 connections per worker and
    # capacity.md documents a thousand-socket run — see docker/nginx/nginx.conf.
    # A limit is not an allocation; this costs nothing until it is needed.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-}
        BUILD_SHA: ${BUILD_SHA:-unknown}
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      # Names the Let's Encrypt certificate to look for, and the CN of the
      # self-signed stand-in when there is none.
      TLS_DOMAIN: ${TLS_DOMAIN:-localhost}
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Who is allowed to set X-Forwarded-For. The default file trusts nobody;
      # behind a CDN, point this at that provider's ranges — otherwise every
      # per-IP rate limit counts the CDN instead of the client.
      - ${TRUSTED_PROXIES_FILE:-./docker/nginx/trusted-proxies.conf}:/etc/nginx/trusted-proxies.conf:ro
      # Certificates live outside the image. Mount whatever your issuer produces
      # at fullchain.pem and privkey.pem. Without them the stack still comes up,
      # on a self-signed certificate, and says so on every boot.
      - ${TLS_CERT_DIR:-./docker/nginx/certs}:/etc/nginx/certs:ro
      # Shared with certbot: the ACME challenge webroot, and the certificates it
      # issues. Read-only here — Nginx serves them, certbot owns them.
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
      - web
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/nginx-health']
      interval: 15s
      timeout: 3s
      retries: 3

  # Issues and renews the origin certificate.
  #
  # Renewal is checked twice a day — Let's Encrypt's own advice, and the reason
  # is jitter: a fleet that all renews at the same hour is a fleet that fails at
  # the same hour. Nothing happens until a certificate is inside thirty days of
  # expiry, so most of these runs do nothing and cost nothing.
  #
  # Nothing here reloads Nginx. Doing so from another container needs the Docker
  # socket, and a container holding that socket can start any container it likes
  # as root on the host — `:ro` protects the socket file, not the API behind it.
  # Nginx watches its own certificate file instead; see
  # docker/nginx/entrypoint/20-watch-renewals.sh.
  # Periodic dumps of the one component that holds financial truth. Verified
  # before anything older is pruned; see docker/backup/backup.sh and
  # docs/disaster-recovery.md. BACKUP_DIR is a host path so the operator's
  # offsite copy can pick the files up — a dump on the database's own disk is
  # a copy, not a backup.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-6}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./docker/backup/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ['/bin/sh', '/backup.sh']
    depends_on:
      postgres:
        condition: service_healthy

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: >
      sh -c 'trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done'
    depends_on:
      - nginx

volumes:
  postgres-data:
  redis-data:
  certbot-www:
  letsencrypt:
