# Running behind a control panel that already owns 80 and 443.
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.cpanel.yml \
#     --env-file .env.production up -d
#
# On a cPanel/CloudLinux box, Apache — and cPanel's own Nginx in front of it —
# serve every site and every webmail on the machine from ports 80 and 443.
# Taking those ports for this stack does not "conflict"; it takes everything
# else on the server down. So this override publishes the edge on loopback
# instead, and the panel's web server proxies one virtual host to it.
#
# Nothing else changes. The stack still terminates TLS internally, still sends
# HSTS, still redirects HTTP to HTTPS — it is the same deployment that would run
# standalone, reached through one more hop. That is deliberate: a second Nginx
# configuration for "behind a proxy" is a second thing to keep correct, and the
# one that gets tested is never the one in production.
#
# The internal hop is https://127.0.0.1:8443 and is encrypted with whatever
# certificate the stack resolved — a self-signed one is fine there, because the
# traffic never leaves the host. The certificate the public sees is the panel's.
services:
  nginx:
    ports: !override
      - '127.0.0.1:${EDGE_HTTP_PORT:-8080}:80'
      - '127.0.0.1:${EDGE_HTTPS_PORT:-8443}:443'

  # Nothing to renew here: the public certificate belongs to the panel, which
  # has its own issuance (AutoSSL) and its own renewal. Two things renewing the
  # same hostname is one more than can succeed.
  certbot:
    profiles: ['never']
