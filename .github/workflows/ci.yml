name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: trading_platform
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trading"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://trading:ci_password@localhost:5432/trading_platform?schema=public
      TEST_DATABASE_URL: postgresql://trading:ci_password@localhost:5432/trading_platform_test?schema=public
      REDIS_URL: redis://localhost:6379
      SECRET_ENCRYPTION_KEYS: 1:Uv10aFLaolFY5n5NqtNGRGoWrrHpPdhRYnFaqt0BHPY=
      JWT_ACCESS_SECRET: ci_only_access_secret_at_least_32_characters
      JWT_REFRESH_SECRET: ci_only_refresh_secret_at_least_32_characters

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      # Workspace packages must be compiled before anything typechecks against
      # them: apps import @tp/* through dist/index.d.ts, which does not exist in
      # a clean checkout.
      - name: Build workspace packages
        run: pnpm build:packages

      # Dependency advisories, which nothing in this repository checked until
      # the first run found two criticals and eleven highs. The penetration
      # checklist delegates this here in as many words — "pnpm audit belongs in
      # CI, not in a script that boots the API" — and for the life of that
      # sentence CI did not run it.
      #
      # High and worse fails the build. Everything below that line, and every
      # override taken to get under it, is written down in
      # security/dependencies.md, which a test checks against package.json in
      # both directions.
      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations
        run: pnpm db:migrate:deploy

      # Integration tests need their own database: they truncate between cases.
      - name: Prepare the integration test database
        run: |
          PGPASSWORD=ci_password createdb -h localhost -U trading trading_platform_test
          DATABASE_URL="$TEST_DATABASE_URL" pnpm db:migrate:deploy

      # Coverage rather than a plain run, because the thresholds in
      # vitest.config.ts are only a claim if nothing evaluates them — and until
      # September 2026 nothing did, here or anywhere else.
      - name: Unit and integration tests, with coverage thresholds
        run: pnpm test:coverage

      # The schema is the last line of defence for financial precision: a single
      # float column would silently corrupt every P&L calculation above it.
      - name: Assert no floating-point columns exist
        run: pnpm check:schema

      - name: Seed reference instruments
        run: pnpm db:seed

      - name: Build
        run: pnpm build

      # The mobile app has no bundle step in CI — a native build needs Xcode or
      # the Android SDK, neither of which belongs on this runner. What CI can
      # check is that its source is consistent with the packages it imports,
      # which `pnpm typecheck` above already does. This step exists to say so
      # rather than to leave the omission looking like an oversight.
      - name: Note on the mobile app
        run: echo "apps/mobile is typechecked and unit-tested above; native builds run in EAS."

      - name: Smoke test the API
        run: pnpm smoke

      # The gateway cannot be exercised from the unit suite — Vitest's esbuild
      # transform drops the decorator metadata Nest needs — so this is the only
      # place the realtime path is proven.
      - name: Smoke test the WebSocket gateway
        run: pnpm smoke:ws

      # Every typed call the web, the phone and the chart package make, made
      # against the compiled API and worker, with the answer checked by the
      # compiler against the type the client reads it as. See
      # scripts/response-contracts.ts for why a green typecheck proves nothing
      # about an answer.
      - name: Check every client's reading of the API's answers
        run: pnpm smoke:contracts

      # Attacks, attempted against the compiled binary. An attack that succeeds
      # fails the build. See docs/penetration-checklist.md — including why a
      # green run is not a claim that there is nothing to find.
      - name: Penetration checklist
        run: pnpm pentest

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # `target: production`, not `target: build`.
      #
      # Stopping at `build` compiles the code and stops one instruction short of
      # the stage that assembles the image that actually ships. That gap hid a
      # real failure: web.Dockerfile's production stage copies apps/web/public,
      # which did not exist, so the web image could not be built at all — and CI
      # was green on every push, because it never reached the line.
      #
      # The build stage is a dependency of the production stage, so this is
      # strictly more coverage rather than a second build.
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          target: production
          push: false
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker.Dockerfile
          target: production
          push: false
      - name: Build nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx.Dockerfile
          push: false
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          target: production
          # The hostname is inlined into the client bundle at build time. This
          # one is a placeholder that proves the argument is wired; a real
          # deployment passes its own. See docs/deployment.md.
          build-args: |
            NEXT_PUBLIC_API_URL=https://example.invalid/api/v1
            NEXT_PUBLIC_WS_URL=https://example.invalid
          push: false
