name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: trading_platform
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trading"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://trading:ci_password@localhost:5432/trading_platform?schema=public
      TEST_DATABASE_URL: postgresql://trading:ci_password@localhost:5432/trading_platform_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_only_access_secret_at_least_32_characters
      JWT_REFRESH_SECRET: ci_only_refresh_secret_at_least_32_characters

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations
        run: pnpm db:migrate:deploy

      # Integration tests need their own database: they truncate between cases.
      - name: Prepare the integration test database
        run: |
          PGPASSWORD=ci_password createdb -h localhost -U trading trading_platform_test
          DATABASE_URL="$TEST_DATABASE_URL" pnpm db:migrate:deploy

      - name: Unit and integration tests
        run: pnpm test

      # The schema is the last line of defence for financial precision: a single
      # float column would silently corrupt every P&L calculation above it.
      - name: Assert no floating-point columns exist
        run: pnpm check:schema

      - name: Seed reference instruments
        run: pnpm db:seed

      - name: Build
        run: pnpm build

      - name: Smoke test the API
        run: pnpm smoke

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          target: build
          push: false
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          target: build
          push: false
