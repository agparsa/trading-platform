# ArvanCloud sits in front of this deployment.
#
# Ranges from https://www.arvancloud.ir/en/ips.txt, fetched 2026-08-30. They
# change. Re-fetch them when adding a region or when a legitimate client starts
# being rate-limited as though it were the CDN — that is what a stale list looks
# like from the inside.
#
# Without these lines every per-IP limit in this file counts the CDN's edge node
# rather than the person making the request, so one attacker and ten thousand
# ordinary users share a single bucket. That is not a weaker rate limit; it is a
# different one, applied to the wrong subject.
set_real_ip_from 185.143.232.0/22;
set_real_ip_from 188.229.116.16/30;
set_real_ip_from 94.101.182.0/27;
set_real_ip_from 2.144.3.128/28;
set_real_ip_from 37.32.16.0/27;
set_real_ip_from 37.32.17.0/27;
set_real_ip_from 37.32.18.0/27;
set_real_ip_from 37.32.19.0/27;
set_real_ip_from 185.215.232.0/22;
set_real_ip_from 178.131.120.48/28;
set_real_ip_from 94.101.183.0/28;
set_real_ip_from 78.157.36.112/28;
set_real_ip_from 95.38.61.80/28;

real_ip_header X-Forwarded-For;

# Walk back through the chain to the first address that is not a trusted proxy.
# Without this, a request that passed through two edge nodes reports the second
# one. With it, and with the list above being accurate, the address is the
# client's — and cannot be forged, because anything arriving from outside those
# ranges is not believed in the first place.
real_ip_recursive on;
