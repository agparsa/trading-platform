# The single door.
#
# Everything behind this — Postgres, Redis, the API, the web app — has no host
# port. That is the point: one place to reason about what is reachable, one
# place TLS terminates, one place a rate limit or an IP block goes.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # The request id the API generates, echoed into the access log, so one line
  # here and one line in the application log can be joined after an incident.
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rid=$upstream_http_x_request_id rt=$request_time';
  access_log  /var/log/nginx/access.log  main;

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout  65;
  server_tokens   off;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss;
  gzip_min_length 1024;

  # Docker's embedded resolver, so an upstream that is restarted or rescheduled
  # is looked up again rather than cached as a dead address for the life of the
  # process.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Docker Compose load-balances these names across replicas by itself; `scale`
  # on the api service is all that is needed to add capacity.
  upstream tp_api {
    server api:4000;
    keepalive 32;
  }

  upstream tp_web {
    server web:3000;
    keepalive 16;
  }

  # Rate limits at the edge, in front of the application's own.
  #
  # Not instead of them: the application limits per authenticated user and knows
  # which route is expensive; this limits per address and does it before a
  # request costs a database connection. Two different questions, both worth
  # asking.
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;
  limit_conn_zone $binary_remote_addr zone=conn:10m;

  server {
    listen 80;
    server_name _;

    # The health check for this container itself, answered without touching
    # anything upstream — it must say whether *Nginx* is alive.
    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    # Everything else is redirected to HTTPS when certificates are present.
    # `try_files` cannot test a file outside the document root, so the redirect
    # is unconditional: a deployment without TLS should be a deployment nobody
    # can reach over HTTP either.
    location / {
      return 308 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/active-certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/active-certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS. Once a browser has seen this it will refuse to speak HTTP to this
    # host at all, which is the point — and the reason it is set here rather
    # than guessed at by the application, which cannot know whether it is behind
    # TLS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 2m;
    limit_conn conn 64;

    # --- the trading API ---------------------------------------------------
    location /api/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://tp_api;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      # The application's per-user rate limiting and its audit trail both read
      # the client address from here. Without it every request appears to come
      # from the proxy, and one abusive client would rate-limit everybody.
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection        "";
      proxy_read_timeout 30s;
    }

    # Sign-in is limited harder than everything else. It is the one route where
    # volume is almost always somebody guessing.
    location /api/v1/auth/login {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://tp_api;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection        "";
    }

    # --- the WebSocket -----------------------------------------------------
    #
    # Not rate-limited here: a socket is one request that then lives for hours,
    # so a request-rate limit would either do nothing or refuse a reconnecting
    # trader. The gateway limits inbound *messages* per socket instead, which is
    # the quantity that actually matters.
    location /ws {
      proxy_pass http://tp_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host       $host;
      proxy_set_header X-Real-IP  $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # A quiet market can go minutes without a tick. A one-minute read timeout
      # would close every socket on a quiet Sunday and reconnect them all at
      # once, which is a self-inflicted thundering herd.
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # --- operational endpoints ---------------------------------------------
    #
    # `/metrics` carries the shape of the whole platform: how many accounts,
    # how many positions, how far behind the feed is. It is not a secret, and it
    # is not public either. Restricted to private ranges, which is where a
    # Prometheus scraper lives; put it behind your own network policy as well.
    location = /metrics {
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      deny  all;
      proxy_pass http://tp_api;
      proxy_set_header Host $host;
    }

    location ~ ^/(health|ready)$ {
      access_log off;
      proxy_pass http://tp_api;
      proxy_set_header Host $host;
    }

    # --- the terminal ------------------------------------------------------
    location / {
      proxy_pass http://tp_web;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
    }
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }
}
