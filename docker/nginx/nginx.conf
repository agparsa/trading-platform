# The single door.
#
# Everything behind this — Postgres, Redis, the API, the web app — has no host
# port. That is the point: one place to reason about what is reachable, one
# place TLS terminates, one place a rate limit or an IP block goes.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # The request id the API generates, echoed into the access log, so one line
  # here and one line in the application log can be joined after an incident.
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rid=$upstream_http_x_request_id rt=$request_time';
  access_log  /var/log/nginx/access.log  main;

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout  65;
  server_tokens   off;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss;
  gzip_min_length 1024;

  # Docker's embedded resolver, so an upstream that is restarted or rescheduled
  # is looked up again rather than cached as a dead address for the life of the
  # process.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Upstreams are resolved per request, not once at startup.
  #
  # An `upstream` block naming `api:4000` is resolved when Nginx starts and then
  # cached for the life of the process. Two consequences, both of which happened
  # here: Nginx refuses to start at all if the API is not up yet
  # ("host not found in upstream"), and after `compose up -d` recreates the API
  # container it holds the old address and answers 502 until somebody restarts
  # it by hand. A deployment that needs a manual Nginx restart to come back is a
  # deployment that will not come back at three in the morning.
  #
  # The cost is the keepalive pool, which an upstream block gives and a
  # variable does not. Over a Docker bridge that is a fraction of a millisecond
  # per request; the 502 is minutes of downtime on every deploy.

  # Who is allowed to tell us where a request came from.
  #
  # This must be read before the zones below, because the address they key on is
  # the one it resolves. Mounted from the host: the default file trusts nobody
  # and uses the direct peer address; a deployment behind a CDN mounts that
  # provider's ranges instead. See docker/nginx/trusted-proxies.conf.
  include /etc/nginx/trusted-proxies.conf;

  # Rate limits at the edge, in front of the application's own.
  #
  # Not instead of them: the application limits per authenticated user and knows
  # which route is expensive; this limits per address and does it before a
  # request costs a database connection. Two different questions, both worth
  # asking.
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;
  limit_conn_zone $binary_remote_addr zone=conn:10m;

  server {
    listen 80;
    server_name _;

    # The health check for this container itself, answered without touching
    # anything upstream — it must say whether *Nginx* is alive.
    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    # The ACME HTTP-01 challenge, and nothing else, is answered over plain HTTP.
    #
    # It has to be: Let's Encrypt fetches this path over port 80 and follows no
    # redirect to a certificate that does not exist yet. A 308 here is how a
    # first issuance fails with an error about the challenge file being
    # unreachable, on a server that is serving it perfectly well one redirect
    # away.
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type "text/plain";
      access_log off;
    }

    # Everything else is redirected to HTTPS when certificates are present.
    # `try_files` cannot test a file outside the document root, so the redirect
    # is unconditional: a deployment without TLS should be a deployment nobody
    # can reach over HTTP either.
    location / {
      return 308 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/active-certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/active-certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS. Once a browser has seen this it will refuse to speak HTTP to this
    # host at all, which is the point — and the reason it is set here rather
    # than guessed at by the application, which cannot know whether it is behind
    # TLS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 2m;
    limit_conn conn 64;

    # --- the trading API ---------------------------------------------------
    location /api/ {
      limit_req zone=api burst=60 nodelay;
      set $api api:4000;
      proxy_pass http://$api;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      # The application's per-user rate limiting and its audit trail both read
      # the client address from here. Without it every request appears to come
      # from the proxy, and one abusive client would rate-limit everybody.
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection        "";
      proxy_read_timeout 30s;
    }

    # Identity documents are the one thing anybody uploads. Ten megabytes is
    # what the application accepts for a single document, and this is that
    # plus headroom — everywhere else the 2m above stands, because nothing
    # else on the API has a reason to send more than a form.
    location /api/v1/kyc/documents {
      client_max_body_size 11m;
      limit_req zone=api burst=20 nodelay;
      set $api api:4000;
      proxy_pass http://$api;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection        "";
      proxy_request_buffering on;
      proxy_read_timeout 60s;
    }

    # Sign-in is limited harder than everything else. It is the one route where
    # volume is almost always somebody guessing.
    location /api/v1/auth/login {
      limit_req zone=auth burst=5 nodelay;
      set $api api:4000;
      proxy_pass http://$api;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection        "";
    }

    # --- the WebSocket -----------------------------------------------------
    #
    # Not rate-limited here: a socket is one request that then lives for hours,
    # so a request-rate limit would either do nothing or refuse a reconnecting
    # trader. The gateway limits inbound *messages* per socket instead, which is
    # the quantity that actually matters.
    # The WebSocket goes to its own containers (§77, docker-compose.prod.yml):
    # fan-out to every connected terminal must not share a process with the
    # requests placing orders.
    location /ws {
      set $api_ws api-ws:4000;
      proxy_pass http://$api_ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      # The map at the foot of this file: "upgrade" when one was asked for,
      # "close" when it was not. A hard-coded "upgrade" is wrong for any request
      # to this path that is not one — Socket.IO's polling transport, for one.
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host       $host;
      proxy_set_header X-Real-IP  $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # A quiet market can go minutes without a tick. A one-minute read timeout
      # would close every socket on a quiet Sunday and reconnect them all at
      # once, which is a self-inflicted thundering herd.
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # --- operational endpoints ---------------------------------------------
    #
    # `/metrics` carries the shape of the whole platform: how many accounts,
    # how many positions, how far behind the feed is. It is not a secret, and it
    # is not public either. Restricted to private ranges, which is where a
    # Prometheus scraper lives; put it behind your own network policy as well.
    location = /metrics {
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      deny  all;
      set $api api:4000;
      proxy_pass http://$api;
      proxy_set_header Host $host;
    }

    # `$` after the group admitted `/health` and `/ready` and nothing else, so
    # every sub-path probe — `/health/market`, and later `/health/jobs` and
    # `/health/tenancy` — answered 404 from the internet while the API served
    # them correctly inside the container. Two layers have to agree on these
    # paths: Nest's global-prefix exclusion list and this block.
    # `HEALTH_ROUTES` is the list; `health-routes.test.ts` checks both against it.
    location ~ ^/(health(/[a-z-]+)?|ready)$ {
      access_log off;
      set $api api:4000;
      proxy_pass http://$api;
      proxy_set_header Host $host;
    }

    # --- the terminal ------------------------------------------------------
    location / {
      set $web web:3000;
      proxy_pass http://$web;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
    }
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }
}
