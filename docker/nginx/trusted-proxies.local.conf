# Behind a reverse proxy on this same host — a control panel's Apache or Nginx.
#
# Only loopback and the Docker bridge may say where a request came from. The
# panel is the one talking to us, and nothing outside this machine can reach
# these ports at all, because the override publishes them on 127.0.0.1.
#
# This is only half the job. The chain is
#
#   client → CDN → panel's nginx → panel's Apache → this
#
# and each hop must pass the client's address along or the real one is lost
# before it ever reaches here. See docs/deployment-cpanel.md: the CDN's ranges
# have to be trusted by the panel's web server too, not only by this one.
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;

real_ip_header X-Forwarded-For;
real_ip_recursive on;
