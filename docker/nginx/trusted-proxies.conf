# Trusted proxies: none.
#
# This is the safe default and it is deliberately empty of directives.
#
# `limit_req_zone $binary_remote_addr` — and every per-IP decision the
# application makes from `X-Forwarded-For` — is only as trustworthy as the
# address it reads. With no proxy in front, the address nginx sees is the
# client's, and that is exactly what should be counted.
#
# Turning on `real_ip_header X-Forwarded-For` without also naming who is allowed
# to set it is worse than doing nothing: any client can then send
# `X-Forwarded-For: 1.2.3.4` and appear as a different address on every request,
# which does not merely weaken the rate limits — it removes them.
#
# If a CDN or load balancer sits in front of this deployment, mount its file
# here instead. `trusted-proxies.arvancloud.conf` is one such file; point
# TRUSTED_PROXIES_FILE at it, or write your own from your provider's published
# ranges.
