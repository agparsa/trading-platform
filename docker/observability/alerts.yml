# What to be woken for, from docs/observability.md. Thresholds are starting
# points for a two-core deployment; the reasoning beside each is the part to
# keep when they are tuned.
groups:
  - name: trading-platform
    rules:
      - alert: MarketFeedStale
        expr: max(tp_market_feed_age_ms{role="ingest"}) > 10000
        for: 30s
        labels: { severity: page }
        annotations:
          summary: The newest tick is over ten seconds old on the ingest instance
          description: Orders are being refused STALE_QUOTE or soon will be. Either the provider stopped or the ingest process is starved.

      - alert: MarketFeedFlat
        expr: sum(rate(tp_market_ticks_total{role="ingest"}[2m])) == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: No ticks ingested for two minutes

      - alert: NoLeaderForTriggerEngine
        expr: sum(tp_leader_lease{loop="trigger-engine"}) == 0
        for: 1m
        labels: { severity: page }
        annotations:
          summary: Nothing holds the trigger-engine lease
          description: Stops and take-profits are not being evaluated anywhere.

      - alert: ExecutionLatencyHigh
        expr: histogram_quantile(0.99, sum(rate(tp_execution_latency_seconds_bucket[5m])) by (le)) > 2
        for: 5m
        labels: { severity: warn }
        annotations:
          summary: p99 acceptance-to-fill above two seconds for five minutes

      - alert: RequestsShed
        expr: sum(rate(tp_http_requests_total{status="503"}[5m])) > 1
        for: 5m
        labels: { severity: warn }
        annotations:
          summary: The API is refusing more than one request a second as overloaded
          description: Admission control (HTTP_MAX_IN_FLIGHT / HTTP_MAX_EVENT_LOOP_LAG_MS) is shedding. Add a serving instance.

      - alert: ReconciliationFindingsOpen
        expr: max(tp_reconciliation_findings_open) > 0
        for: 1m
        labels: { severity: page }
        annotations:
          summary: The ledger disagrees with a cached balance
          description: The most serious alert here. Nothing repairs it automatically; see docs/runbook.md.

      - alert: IntegritySignalsOpen
        expr: max(tp_integrity_signals_open) > 0
        for: 5m
        labels: { severity: warn }
        annotations:
          summary: Market-data integrity signals are open

      - alert: RealtimeValuationsDeferred
        expr: sum(rate(tp_realtime_valuations_deferred_total[5m])) > 10
        for: 10m
        labels: { severity: warn }
        annotations:
          summary: Screens are refreshing less often than the interval
          description: The valuation pass is out of budget every second; orders keep their share of the loop, traders see slower updates. Add a serving instance.

      - alert: EventLoopLag
        expr: max(tp_nodejs_eventloop_lag_p99_seconds) > 0.5
        for: 5m
        labels: { severity: warn }
        annotations:
          summary: Event-loop lag p99 above half a second on an API instance

      # ── The silent failures ─────────────────────────────────────────────
      #
      # Everything above this line is something going wrong loudly: a feed
      # stopping, latency climbing, requests being shed. The four below are the
      # ones that produce no error anywhere — the work simply stops happening,
      # or a job gives up and waits for somebody who is not looking.
      #
      # `docs/observability.md` has listed all four under *What to alert on*
      # since they were written, and none of them had a rule. The table names
      # the rule per row now, and a deployment test reads it in both
      # directions.

      - alert: ApiTargetDown
        expr: up{job="api"} == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: An API process has stopped answering Prometheus
          description: The instance labelled in this alert is unreachable on the compose network. Readiness itself is the container healthcheck's job — this is the coarser question, whether the process is there at all.

      - alert: ScheduleLate
        expr: max by (job) (tp_scheduled_job_late) > 0
        for: 5m
        labels: { severity: warn }
        annotations:
          summary: Scheduled job {{ $labels.job }} is later than its own cron allows
          description: The gauge is judged against each job's own schedule, so this is lateness rather than a fixed threshold. A stopped schedule produces no error and no failed job — the process that would have written them never ran. Check WORKER_ROLE and the worker's logs.

      - alert: ScheduleNeverSucceeded
        expr: max by (job) (tp_scheduled_job_age_ms) == -1
        for: 15m
        labels: { severity: page }
        annotations:
          summary: Scheduled job {{ $labels.job }} has run and has never succeeded
          description: A row exists, so something ran it; -1 means no run has ever finished successfully. Usually the job is failing every time rather than not being registered.

      - alert: BackupLate
        expr: max(tp_scheduled_job_late{job="backup"}) > 0
        for: 15m
        labels: { severity: page }
        annotations:
          summary: The backup has stopped or is failing
          description: Its dumps are the only thing standing between a lost primary and a lost business. Separate from ScheduleLate and louder than it on purpose — this one is not a job that can be caught up tomorrow.

      - alert: DeadLetterNotEmpty
        expr: max by (queue) (tp_dead_letter_depth) > 0
        for: 5m
        labels: { severity: page }
        annotations:
          summary: A job in {{ $labels.queue }} has given up and is waiting for a human
          description: Queues keep failures (removeOnFail is false) precisely so a financial job that exhausted its retries stays visible. Nothing clears this on its own.

      - alert: TenantIsolationAbsent
        expr: max(tp_tenant_isolation{configured="true"}) == 0
        for: 5m
        labels: { severity: page }
        annotations:
          summary: DATABASE_URL_TENANT is set and row-level security does not apply
          description: The deployment asked for the second isolation layer and does not have it. The `configured` label is what makes this expressible — without it, this reading is indistinguishable from the documented single-role posture, where 0 is correct.
